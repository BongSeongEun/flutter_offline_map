name: flutter_offline_map
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.25.0
  path_provider: ^2.1.5
  geolocator: ^10.1.0
  permission_handler: ^11.3.0
  mobile_rag_engine: ^0.4.1
  sqflite: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/south-korea.mbtiles
    - assets/map/style.json
    - assets/fonts/Noto_Sans_KR_Thin/
    - assets/models/gemma-3-1b-it.task
    - assets/models/model_quantized.onnx
    - assets/models/tokenizer.json
    - assets/data/jeju_data.json
    - assets/data/jeju_tour_vectors.db